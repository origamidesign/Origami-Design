<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="gold"><stop stop-color="#d5aa51" stop-opacity="0"/><stop offset=".35" stop-color="#e0c28b"/><stop offset=".65" stop-color="#aa8645"/><stop offset="1" stop-color="#d5aa51" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#d2ab60" stop-opacity=".1"/><stop offset="1" stop-color="#d2ab60" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .ribbon{transform-origin:800px 500px;animation:sway 28s ease-in-out infinite alternate}.second{animation-delay:-14s;animation-direction:alternate-reverse}
    @keyframes sway{from{transform:rotate(-3deg) translateY(-12px)}to{transform:rotate(3deg) translateY(12px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <ellipse cx="200" cy="300" rx="500" ry="450" fill="url(#halo)"/><ellipse cx="1450" cy="750" rx="500" ry="450" fill="url(#halo)"/>
  <g class="ribbon" stroke="url(#gold)"><path d="M-220 850C150 780 170 50 700 170S1250 1120 1840 320" stroke-width="1"/></g>
  <g class="ribbon second" stroke="url(#gold)"><path d="M-150 100C300 920 430 1070 940 740S1240-220 1790 100" stroke-width=".8" stroke-opacity=".65"/></g>
</svg>